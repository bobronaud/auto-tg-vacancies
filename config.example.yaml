# Скопируйте в config.yaml (он в .gitignore) и настройте: cp config.example.yaml config.yaml
# Секреты (API-ключи, пароли) здесь ЗАПРЕЩЕНЫ — храните их в .env.

# Какие вакансии вы ищете. Передаётся LLM, которая отмечает каждую вакансию как подходящую или нет.
# Вакансия подходит, если её роль есть в `roles` (при любом стеке) или её основной стек пересекается со `stack`
# и она не исключена. Грейд, формат работы, локация и зарплата на отбор не влияют.
profile:
  roles: [frontend, fullstack]
  description: "Frontend/fullstack developer: JavaScript, TypeScript, React, Vue"
  stack: [javascript, typescript, react, vue]
  excludeKeywords: [pure backend without frontend, python only]  # что делает вакансию неподходящей
  includeFreelance: false           # собирать и разовые фриланс-заказы (например, kwork.ru)

# Откуда собирать вакансии. Заполняется автоматически: npm run dev → «Источники»
sources: []
#  - type: channel                  # channel | group | bot
#    username: example_jobs_channel
#    title: "Example Jobs"
#    enabled: true
#    hints: ""                      # заметки о формате постов, передаются LLM

scrape:
  lookbackDays: 14                  # на сколько дней назад читать при первом запуске
  parallelSources: 4                # сколько источников собирается одновременно (вкладки браузера)
  headless: true

# Все LLM-запросы идут через авторизованный Codex CLI 0.166.0+ (`codex login`).
# Инструменты, MCP, плагины, хуки и инструкции проекта для этих вызовов отключены.
llm:
  # model: <доступная-модель-Codex>  # без поля: model из настроек Codex, затем выбор CLI
  effort: low
  batchSize: 10                     # сообщений за вызов — пакеты экономят большую часть накладных расходов
  concurrency: 2                    # параллельных процессов `codex exec`
  timeoutSec: 180

storage:
  dbPath: .data/vacancies.db

browser:
  profileDir: .data/browser-profile # ваша сессия Telegram — держите её в секрете
  webUrl: https://web.telegram.org/k/

# Автоотклик. `apply` отправляет отклики без подтверждения — сначала прогоните его с dryRun: true.
# Пароль SMTP кладётся в .env как SMTP_PASSWORD (для Gmail — пароль приложения).
apply:
  dryRun: true                      # false — отправлять по-настоящему
  methods: [email, telegram, bot_button, mini_app]
  # Резюме: факты для сопроводительных писем (markdown, в .gitignore) и необязательный PDF для вложения.
  resumes: []
  #  - id: react
  #    title: "Frontend-разработчик (React, TypeScript)"
  #    match: [react, next.js, redux]
  #    file: resumes/resume.react.md
  #    pdf: resumes/resume.react.pdf
  #  - id: fullstack
  #    title: "Fullstack-разработчик (React, Node.js)"
  #    titleMatch: [fullstack, full-stack]   # только когда это есть в названии вакансии; `match` не учитывается
  #    file: resumes/resume.fullstack.md
  # fallbackResume: react
  letter:
    maxChars: 1000
    minChars: 300
    extraSkills: ""                 # опыт, о котором стоит упомянуть, но которого нет в резюме
    batchSize: 10                   # писем за один вызов codex exec
    estimateMissing: false          # вопросы рекрутера без точного ответа в резюме: true — правдоподобная оценка, false — [уточнить]
  email:
    from: ""                        # you@example.com
    user: ""                        # логин SMTP, по умолчанию — `from`
    smtpHost: ""                    # smtp.gmail.com
    smtpPort: 465
    subject: "Отклик на вакансию {title}"
