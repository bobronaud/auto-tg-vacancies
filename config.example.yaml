# Copy to config.yaml (gitignored) and adjust: cp config.example.yaml config.yaml
# Secrets (API keys, passwords) are NOT allowed here — put them into .env.

# What vacancies you are looking for. Everything here is passed to the LLM as your profile.
profile:
  roles: [frontend]
  description: "Frontend developer, React + TypeScript, middle/senior, remote"
  stack: [react, typescript, next.js]
  grades: [middle, senior]          # intern | junior | middle | senior | lead
  excludeKeywords: [php, 1c]        # things that make a vacancy irrelevant
  workFormat: [remote, hybrid]      # remote | hybrid | office
  locations: [any]
  # salaryMin: { amount: 3000, currency: USD }
  languages: [ru, en]
  includeFreelance: false           # also collect one-off freelance projects (e.g. kwork.ru orders)

# Where to collect vacancies. Fill automatically with: npm run dev → «Источники»
sources: []
#  - type: channel                  # channel | group | bot
#    username: example_jobs_channel
#    title: "Example Jobs"
#    enabled: true
#    hints: ""                      # notes about the post format, passed to the LLM
#  - type: bot
#    username: example_jobs_bot
#    bot:
#      startCommand: /start
#      steps:
#        - click: "Vacancies"
#        - repeat: { click: "Next" }
#          times: 20

scrape:
  lookbackDays: 14                  # how far back to read on the first run
  parallelSources: 4                # sources scraped at the same time (browser tabs)
  headless: true

# Classification runs through the local `claude -p` (your Claude Code subscription, no API key).
# Claude Code's tools, MCP servers, settings and CLAUDE.md are switched off for these calls.
llm:
  model: sonnet                     # sonnet | opus | haiku or a full model id
  effort: low
  minRelevance: 0.6                 # vacancies scoring >= this get status "matched"
  batchSize: 10                     # messages per call — batching saves most of the overhead
  concurrency: 2                    # parallel `claude -p` processes
  timeoutSec: 180

storage:
  dbPath: .data/vacancies.db

browser:
  profileDir: .data/browser-profile # your Telegram session — keep it private
  webUrl: https://web.telegram.org/k/

# Auto-apply. Every application is shown for review before it goes out.
# The SMTP password goes to .env as SMTP_PASSWORD (Gmail: an app password).
apply:
  dryRun: true                      # set to false to really send
  methods: [email, telegram, bot_button, mini_app]
  # Resumes: facts for cover letters (markdown, gitignored) and an optional PDF to attach.
  resumes: []
  #  - id: react
  #    title: "Frontend-разработчик (React, TypeScript)"
  #    match: [react, next.js, redux]
  #    file: resumes/resume.react.md
  #    pdf: resumes/resume.react.pdf
  # fallbackResume: react
  letter:
    maxChars: 1000
    minChars: 300
    extraSkills: ""                 # experience worth mentioning that the resume doesn't spell out
    batchSize: 10                   # letters per claude -p call
    estimateMissing: false          # recruiter questions without an exact answer in the resume: true = plausible estimate, false = [уточнить]
  email:
    from: ""                        # you@example.com
    user: ""                        # SMTP login, defaults to `from`
    smtpHost: ""                    # smtp.gmail.com
    smtpPort: 465
    subject: "Отклик на вакансию {title}"
